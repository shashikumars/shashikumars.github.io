<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link preview card</title>
<!--
  The 1200x630 card a link to shashikumars.github.io unfurls into on LinkedIn,
  in email and in chat (og:image). Folders starting with _ are not published by
  GitHub Pages, so this source stays out of the site. Render with:
    msedge --headless=new --hide-scrollbars --force-device-scale-factor=1
           --window-size=1200,630 --screenshot=G:\Jobs\portfolio\og.png
           file:///G:/Jobs/portfolio/_source/og-card.html
  A feed shows the card at about 500 px wide, so the name and the one line
  under it carry it; the photos are there to say "real hardware" at a glance.
-->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; align-items: center; gap: 48px; padding: 0 64px; box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif; color: #e6e8ea;
    background: radial-gradient(900px 500px at 15% 0%, rgba(141, 184, 242, .16), transparent 70%), #111316;
  }
  .text { flex: 1; }
  .url { font-size: 24px; font-weight: 600; color: #8db8f2; letter-spacing: .3px; }
  h1 { margin: 14px 0 0; font-size: 76px; line-height: 1.02; font-weight: 700; letter-spacing: -1.5px; }
  .role { margin: 18px 0 0; font-size: 34px; font-weight: 600; }
  .sub { margin: 14px 0 0; font-size: 26px; line-height: 1.4; color: #9aa3ac; }
  .photos { display: flex; flex-direction: column; gap: 18px; width: 440px; }
  .photos > * {
    border-radius: 18px; border: 1px solid #2a2f35; box-shadow: 0 14px 34px rgba(0, 0, 0, .5);
  }
  /* hejje on top: the logo and name beside a real app screen, cropped to its top */
  .app {
    height: 248px; box-sizing: border-box; display: flex; overflow: hidden;
    background: #0b0c0a; position: relative;
  }
  .app .brand { flex: 1; padding: 30px 0 0 30px; }
  .app .brand img { width: 64px; height: 64px; border-radius: 15px; display: block; }
  .app .name { margin-top: 16px; font-size: 40px; font-weight: 700; letter-spacing: -.5px; }
  .app .what { margin-top: 4px; font-size: 19px; line-height: 1.35; color: #9aa3ac; }
  .app .screen {
    width: 170px; height: 302px; object-fit: cover; object-position: top;
    margin: 22px 26px 0 0; border-radius: 16px; border: 1px solid #2a2f35; display: block;
  }
  .clock { width: 440px; height: 248px; object-fit: cover; display: block; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: #8db8f2; }
</style>
</head>
<body>
  <div class="text">
    <div class="url">shashikumars.github.io</div>
    <h1>Shashi Kumar S</h1>
    <p class="role">Senior software engineer · 11 years</p>
    <p class="sub">Products end to end: backends, mobile apps, and the small devices that talk to them.</p>
  </div>
  <div class="photos">
    <div class="app">
      <div class="brand">
        <img src="hejje-logo-knockout.svg" alt="">
        <div class="name">hejje</div>
        <div class="what">Private fitness tracker,<br>on Android and iPhone</div>
      </div>
      <img class="screen" src="../media/route.webp" alt="">
    </div>
    <img class="clock" src="../media/eink-refresh.jpg" alt="">
  </div>
  <div class="bar"></div>
</body>
</html>
